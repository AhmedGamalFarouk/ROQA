[package]
name = "roqa"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
# Same version the windows crate already locks; required by the #[implement] COM macro's absolute paths.
windows-core = "=0.62.2"
# Same version the windows crate already locks; Direct2D path points are its Vector2.
windows-numerics = "=0.3.1"
# Same version the windows crate already locks; names the IAsyncOperation that media requests hold to cancel.
windows-future = "=0.3.2"
windows = { version = "=0.62.2", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    # Core Audio: IMMDeviceEnumerator, IMMNotificationClient and AUDIO_VOLUME_NOTIFICATION_DATA (slice 6).
    "Win32_Media_Audio",
    # IAudioEndpointVolume and its callback (slice 6).
    "Win32_Media_Audio_Endpoints",
    "UI_ViewManagement",
    "Win32_System_WinRT",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    # MODIFIERKEYS_FLAGS in IDropTarget (the shelf drop target, slice S6).
    "Win32_System_SystemServices",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    # SHELLEXECUTEINFOW / ShellExecuteExW (no-UI launch of a not-running pin, slice S4) are gated on it.
    "Win32_System_Registry",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_DirectWrite",
    "Win32_Globalization",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    # MessageBeep: the timer completion sound (slice S5).
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    # Private bytes for the diagnostics budget table (slice S9).
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[[bin]]
name = "roqa-uia-probe"
path = "tests/support/uia_probe.rs"
test = false
