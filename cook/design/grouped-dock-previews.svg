  <path d="m867 54 5-5 5 5" fill="none" stroke="#76767d" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m867 234 5 5 5-5" fill="none" stroke="#f6f6f7" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#dock" x="304" y="268"/><use href="#dock" x="752" y="268"/>
