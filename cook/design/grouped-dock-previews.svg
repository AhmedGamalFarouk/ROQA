<svg xmlns="http://www.w3.org/2000/svg" width="920" height="370" viewBox="0 0 920 370" role="img" aria-labelledby="title desc">
  <title id="title">ROQA grouped previews in Classic</title>
  <desc id="desc">Three native thumbnails with independent close controls, beside a six-row compact list with scroll controls.</desc>
  <defs>
    <style>text{font-family:'Segoe UI Variable','Segoe UI',sans-serif}.caption{fill:#bec0c5;font-size:13px}.title{fill:#f6f6f7;font-size:12px}.shot{fill:#a9abb0;font-size:8px}.shot-light{fill:#41464e;font-size:8px}</style>
    <g id="close"><circle r="16" fill="currentColor"/><path d="m-4-4 8 8m0-8-8 8" fill="none" stroke="inherit" stroke-width="1.75" stroke-linecap="round"/></g>
    <g id="tile"><rect width="176" height="136" rx="12" fill="#25252a"/></g>
    <g id="dock">
      <rect x="-90" y="0" width="180" height="52" rx="26" fill="#141416"/>
      <rect x="-20" y="6" width="40" height="40" rx="16" fill="#323237"/>
      <g fill="none" stroke="#dddde0" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-10" y="17" width="18" height="15" rx="3"/><path d="M-6 14h14a4 4 0 0 1 4 4v10M-10 22H8"/>
        <path d="M-63 18h17v16h-17zM-63 23h17M48 21h14v12H48zM51 18h8"/>
      </g>
      <rect x="-10" y="44" width="20" height="2" rx="1" fill="#c3c3c6"/>
    </g>
  </defs>
  <rect width="920" height="370" rx="16" fill="#37383d"/>
  <text class="caption" x="24" y="92">Thumbnail strip · three windows</text>
  <rect x="24" y="108" width="560" height="152" rx="20" fill="#141416"/>
