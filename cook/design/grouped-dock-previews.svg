    <rect x="9" y="9" width="158" height="14" rx="3" fill="#474c58"/><text class="shot" x="16" y="19">Workspaces</text>
    <rect x="15" y="28" width="31" height="62" rx="3" fill="#414652"/>
    <rect x="52" y="28" width="108" height="62" rx="3" fill="#292c34"/>
    <path d="M61 38h36m-36 10h83m-83 6h67m-67 6h74m-74 12h82m-82 6h59" stroke="#888d9a" stroke-width="2" stroke-linecap="round"/>
